; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the device firmware only; the native env is for host tests.
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
platform = espressif32
framework = arduino
board = esp32-s3-devkitm-1
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0
    arduino-libraries/Arduino_JSON@^0.2.0
; Host tests live in test/native/ and run with `pio test -e native`.
test_ignore = native/*

; Host-side unit tests for hardware-independent logic. Only the pure sources
; listed in build_src_filter are compiled; nothing here may include Arduino.h.
[env:native]
platform = native@1.2.1
test_build_src = yes
test_filter = native/*
build_src_filter = -<*> +<display/TideInterval.cpp> +<models/TideExtreme.cpp>
build_flags = -std=gnu++17 -Isrc
